# ==============================================================
# PRODUCTION CONFIGURATION FOR RAILWAY
# ==============================================================

# Database Connection (Railway MySQL Internal)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql.railway.internal:3306/railway?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dJZYLiMlOMVLRqtPNNFrkSCUexfsADVo}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Server Port (Railway will usually provide this via PORT env)
server.port=${PORT:8080}

# Email Configuration (Uses Environment Variables)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# H2 Console (Disabled in production)
spring.h2.console.enabled=false

# Optimization for Hosting
spring.devtools.restart.enabled=false
spring.sql.init.mode=never
